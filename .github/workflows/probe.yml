name: quota-probe

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时，错开整点
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quota-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 各渠道密钥全部可选：未配置的渠道自动显示为"待密钥"
      - name: Run probes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          CF_WORKERS_AI_TOKEN: ${{ secrets.CF_WORKERS_AI_TOKEN }}
        run: |
          python3 scripts/probe.py
          python3 scripts/render.py

      - name: Commit results
        run: |
          git config user.name "quota-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/radar.svg data/results.json data/history.jsonl \
                  data/badge-alive.json data/badge-sweep.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "probe: refresh quota status ($(date -u +%FT%TZ))"
            git push
          fi
