name: quota-probe

on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时，错开整点
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: quota-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 各渠道密钥全部可选：未配置的渠道自动显示为"待密钥"
      - name: Run probes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          CF_WORKERS_AI_TOKEN: ${{ secrets.CF_WORKERS_AI_TOKEN }}
        run: |
          python3 scripts/probe.py
          python3 scripts/render.py

      - name: Commit results
        run: |
          git config user.name "quota-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add README.md README.zh-CN.md assets/radar.svg data/results.json \
                  data/history.jsonl data/badge-alive.json data/badge-sweep.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "probe: refresh quota status ($(date -u +%FT%TZ))"
            git push
          fi

      # ── 告警（保险一）：同一个 issue 去重，恢复后自动关闭；只写状态摘要，不含密钥/响应体 ──
      - name: Assess probe health
        id: health
        if: success()
        run: echo "status=$(python3 scripts/alert.py)" >> "$GITHUB_OUTPUT"

      - name: Open or update alert issue
        if: failure() || steps.health.outputs.status == 'degraded'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH: ${{ steps.health.outputs.status }}
        run: |
          gh label create probe-failure --color B60205 \
            --description "Automated: probe run failed or all probed channels down" --force
          if [ "$HEALTH" = "degraded" ]; then
            msg="All probed channels are unavailable in this run (possible platform/network/key-wide problem). Run: $RUN_URL"
          else
            msg="The probe workflow failed before finishing. Run: $RUN_URL"
          fi
          n=$(gh issue list --label probe-failure --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$msg"
          else
            gh issue create --title "Probe alert: radar needs attention" --label probe-failure --body "$msg"
          fi

      - name: Close alert issue on recovery
        if: success() && steps.health.outputs.status == 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --label probe-failure --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "Recovered: probe healthy again. Run: $RUN_URL"
          fi
